
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<style>
  body{font-family:sans-serif;text-align:center;padding:30px;background:#111;color:#fff}
  .icono{font-size:80px;margin:10px}
  button{font-size:20px;padding:14px 24px;border-radius:12px;border:0;background:#1f883d;color:#fff}
</style>
</head>
<body>
<h1>Jarvis</h1>
<span class="icono" id="luz">💡</span>
<span class="icono" id="tele">📺</span>
<p id="texto">Toca el botón y habla</p>
<button onclick="iniciar()">🎤 Iniciar</button>

<script>
// Pega aquí tus enlaces (IFTTT, Home Assistant, etc.)
const URL_LUZ_OFF  = "";
const URL_TELE_OFF = "";

const UMBRAL_APLAUSO = 0.5;   // baja a 0.35 si no detecta; sube a 0.7 si se activa solo
const ESPERA_MS = 10000;      // tiempo para aplaudir después de la orden

let pendiente = null;         // "luz" o "tele"
let timer = null;
let ultimoAplauso = 0;

const R = window.SpeechRecognition || window.webkitSpeechRecognition;
const rec = new R();
rec.lang = "es-ES";
rec.continuous = true;

function setTexto(t){ document.getElementById("texto").innerText = t; }

function llamar(url){
  if(url) fetch(url, {mode:"no-cors"}).catch(()=>{});
}

function responder(t){
  const v = new SpeechSynthesisUtterance(t);
  v.lang = "es-ES";
  speechSynthesis.speak(v);
}

function esperarAplauso(que){
  pendiente = que;
  clearTimeout(timer);
  setTexto("Aplaude para apagar " + (que === "luz" ? "la luz del comedor" : "la tele") + " 👏");
  timer = setTimeout(() => { pendiente = null; setTexto("Orden cancelada"); }, ESPERA_MS);
}

function ejecutar(){
  if(pendiente === "luz"){
    document.getElementById("luz").innerText = "🌑";
    llamar(URL_LUZ_OFF);
    responder("Luz del comedor apagada");
  } else if(pendiente === "tele"){
    document.getElementById("tele").innerText = "⬛";
    llamar(URL_TELE_OFF);
    responder("Tele apagada");
  }
  pendiente = null;
  clearTimeout(timer);
  setTexto("Listo");
}

rec.onresult = (e) => {
  const f = e.results[e.results.length-1][0].transcript.toLowerCase().trim();
  setTexto("Dijiste: " + f);
  if(!f.includes("jarvis")) return;

  if(f.includes("apaga la luz")) esperarAplauso("luz");
  else if(f.includes("apaga la tele")) esperarAplauso("tele");
};
rec.onend = () => { try{ rec.start(); }catch(e){} };

async function iniciar(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const analizador = ctx.createAnalyser();
    analizador.fftSize = 512;
    ctx.createMediaStreamSource(stream).connect(analizador);
    const datos = new Uint8Array(analizador.fftSize);

    function revisar(){
      analizador.getByteTimeDomainData(datos);
      let pico = 0;
      for(const v of datos) pico = Math.max(pico, Math.abs(v - 128) / 128);
      const ahora = Date.now();
      if(pico > UMBRAL_APLAUSO && ahora - ultimoAplauso > 800){
        ultimoAplauso = ahora;
        if(pendiente) ejecutar();
      }
      requestAnimationFrame(revisar);
    }
    revisar();
  }catch(e){
    setTexto("No pude usar el micrófono");
    return;
  }
  try{ rec.start(); }catch(e){}
  setTexto("Escuchando... di: Jarvis apaga la luz");
}
</script>
</body>
</html>
